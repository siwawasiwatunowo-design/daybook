name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Fetch sherpa-onnx
        run: bash scripts/fetch-sherpa-onnx.sh
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon -PdaybookApiBaseUrl="${{ vars.DAYBOOK_API_BASE_URL || 'http://10.0.2.2:5000/' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Daybook-APK
          path: app/build/outputs/apk/debug/app-debug.apk